name: Build Beta ZIP to APK & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-beta-zip:
    name: Build Beta ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout workflow anchor
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Keep one stable debug signing identity for the separate Beta package.
      # This key is NOT the Stable app release key.
      - name: Restore Beta debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-todo-beta-debug-keystore-v1

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager not found at expected path; using runner preinstalled Android SDK."
          fi

      - name: Find newest ZIP in Beta Source Inbox draft
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASES_JSON="${RUNNER_TEMP}/releases.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RELEASES_JSON"

          RELEASE_JSON="$(
            jq -c '[.[] | select(.draft == true and .name == "Beta Source Inbox")][0]' \
              "$RELEASES_JSON"
          )"

          if [ -z "$RELEASE_JSON" ] || [ "$RELEASE_JSON" = "null" ]; then
            echo "::error::Draft release 'Beta Source Inbox' was not found."
            echo "::error::Create one draft release with that exact title, upload the Beta Full ZIP to it, then run this workflow again."
            exit 1
          fi

          ASSET_JSON="$(
            printf '%s' "$RELEASE_JSON" \
              | jq -c '[.assets[] | select(.name | ascii_downcase | endswith(".zip"))] | sort_by(.created_at) | reverse | .[0]'
          )"

          if [ -z "$ASSET_JSON" ] || [ "$ASSET_JSON" = "null" ]; then
            echo "::error::No ZIP asset was found in draft release 'Beta Source Inbox'."
            exit 1
          fi

          ASSET_ID="$(printf '%s' "$ASSET_JSON" | jq -r '.id')"
          ASSET_NAME="$(printf '%s' "$ASSET_JSON" | jq -r '.name')"

          echo "asset_id=$ASSET_ID" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Using source asset: $ASSET_NAME"

      - name: Download private draft ZIP
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_ID: ${{ steps.source.outputs.asset_id }}
          ASSET_NAME: ${{ steps.source.outputs.asset_name }}
        run: |
          set -euo pipefail

          ZIP_PATH="${RUNNER_TEMP}/beta-source.zip"

          curl --fail --location \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            --output "$ZIP_PATH"

          test -s "$ZIP_PATH"

          ZIP_SHA="$(sha256sum "$ZIP_PATH" | awk '{print $1}')"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_sha=$ZIP_SHA" >> "$GITHUB_OUTPUT"

          echo "Input ZIP: $ASSET_NAME"
          echo "Input SHA-256: $ZIP_SHA"

      - name: Validate and extract ZIP safely
        id: project
        shell: bash
        env:
          ZIP_PATH: ${{ steps.download.outputs.zip_path }}
        run: |
          set -euo pipefail

          EXTRACT_DIR="${RUNNER_TEMP}/beta-extracted"
          mkdir -p "$EXTRACT_DIR"

          python3 - "$ZIP_PATH" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import PurePosixPath

          zip_path = sys.argv[1]

          with zipfile.ZipFile(zip_path) as zf:
              bad = []
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  p = PurePosixPath(name)

                  if p.is_absolute() or ".." in p.parts:
                      bad.append(name)
                      continue

                  mode = (info.external_attr >> 16) & 0xFFFF
                  if mode and stat.S_ISLNK(mode):
                      bad.append(name)

              if bad:
                  raise SystemExit(
                      "Unsafe ZIP entries detected: " + ", ".join(bad[:20])
                  )
          PY

          unzip -q "$ZIP_PATH" -d "$EXTRACT_DIR"

          if [ -f "$EXTRACT_DIR/gradlew" ]; then
            PROJECT_ROOT="$EXTRACT_DIR"
          else
            mapfile -t ROOT_DIRS < <(
              find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 -type d ! -name "__MACOSX" | sort
            )

            if [ "${#ROOT_DIRS[@]}" -eq 1 ] && [ -f "${ROOT_DIRS[0]}/gradlew" ]; then
              PROJECT_ROOT="${ROOT_DIRS[0]}"
            else
              echo "::error::Cannot find project root. The ZIP must contain gradlew at its root, or inside one single top-level folder."
              find "$EXTRACT_DIR" -maxdepth 2 -type f | head -n 100 || true
              exit 1
            fi
          fi

          if [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ] && [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then
            echo "::error::settings.gradle(.kts) is missing."
            exit 1
          fi

          if [ -f "$PROJECT_ROOT/android/app/build.gradle.kts" ]; then
            APP_GRADLE="$PROJECT_ROOT/android/app/build.gradle.kts"
          elif [ -f "$PROJECT_ROOT/android/app/build.gradle" ]; then
            APP_GRADLE="$PROJECT_ROOT/android/app/build.gradle"
          else
            echo "::error::android/app/build.gradle(.kts) is missing."
            exit 1
          fi

          export APP_GRADLE
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["APP_GRADLE"])
          text = path.read_text(encoding="utf-8", errors="replace")

          pattern = r"applicationId\s*(?:=|\()\s*[\"']com\.todolist\.app\.beta[\"']"
          if not re.search(pattern, text):
              raise SystemExit(
                  "SAFETY BLOCK: applicationId is not exactly com.todolist.app.beta. "
                  "Refusing to build a ZIP that could overwrite the installed Stable app."
              )
          PY

          # Never trust a developer-machine local.properties inside a Full ZIP.
          # Point this cloud build explicitly at the Android SDK installed on the runner.
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$PROJECT_ROOT/local.properties"

          chmod +x "$PROJECT_ROOT/gradlew"

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_ROOT"
          echo "Beta applicationId guard: PASS"

      - name: Build Beta debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_root }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Collect APK and checksums
        id: package
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
          ASSET_NAME: ${{ steps.source.outputs.asset_name }}
          INPUT_SHA: ${{ steps.download.outputs.zip_sha }}
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_ROOT/android/app/build/outputs/apk" \
              -type f -name '*.apk' | sort | head -n 1
          )"

          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "::error::APK not found after successful Gradle task."
            find "$PROJECT_ROOT/android/app/build/outputs" -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p dist-ci

          SOURCE_BASE="${ASSET_NAME%.zip}"
          SOURCE_BASE="${SOURCE_BASE%-Full}"

          SAFE_LABEL="$(
            printf '%s' "$SOURCE_BASE" \
              | tr ' /' '--' \
              | tr -cd 'A-Za-z0-9._-'
          )"

          if [ -z "$SAFE_LABEL" ]; then
            SAFE_LABEL="Tree-Beta"
          fi

          OUT="dist-ci/${SAFE_LABEL}-Build-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"

          META="dist-ci/${SAFE_LABEL}-Build-${GITHUB_RUN_NUMBER}.txt"
          {
            echo "Source ZIP: $ASSET_NAME"
            echo "Source ZIP SHA-256: $INPUT_SHA"
            echo "APK: $(basename "$OUT")"
            echo "APK SHA-256: $(awk '{print $1}' "${OUT}.sha256")"
            echo "GitHub Actions run: $GITHUB_RUN_ID"
          } > "$META"

          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha_path=${OUT}.sha256" >> "$GITHUB_OUTPUT"
          echo "meta_path=$META" >> "$GITHUB_OUTPUT"
          echo "safe_label=$SAFE_LABEL" >> "$GITHUB_OUTPUT"

          echo "Built:"
          cat "$META"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.safe_label }}-Build-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.sha_path }}
            ${{ steps.package.outputs.meta_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create Beta GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.package.outputs.apk_path }}
          SHA_PATH: ${{ steps.package.outputs.sha_path }}
          META_PATH: ${{ steps.package.outputs.meta_path }}
          SAFE_LABEL: ${{ steps.package.outputs.safe_label }}
          SOURCE_NAME: ${{ steps.source.outputs.asset_name }}
          SOURCE_SHA: ${{ steps.download.outputs.zip_sha }}
        run: |
          set -euo pipefail

          TAG="tree-beta-build-${GITHUB_RUN_NUMBER}"
          TITLE="${SAFE_LABEL} · Build #${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            "$APK_PATH" \
            "$SHA_PATH" \
            "$META_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Built by GitHub Actions from private Draft Release source asset: ${SOURCE_NAME}. Source ZIP SHA-256: ${SOURCE_SHA}. The automatically generated GitHub 'Source code' links belong to the workflow anchor commit on main and are NOT the Beta Full source ZIP. This APK passed the safety guard applicationId=com.todolist.app.beta." \
            --prerelease

      - name: Remove consumed source ZIP from private draft
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_ID: ${{ steps.source.outputs.asset_id }}
        run: |
          set -euo pipefail

          if gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          then
            echo "Consumed Beta source ZIP removed from Draft Release inbox."
          else
            echo "::warning::Build succeeded, but the consumed source ZIP could not be removed automatically. Delete it from the Draft Release manually."
          fi
