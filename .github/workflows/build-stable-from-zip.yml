name: Build Stable ZIP to APK & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stable-zip:
    name: Build Stable ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout workflow anchor
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager not found at expected path; using runner preinstalled Android SDK."
          fi

      - name: Find newest ZIP in Stable Source Inbox draft
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASES_JSON="${RUNNER_TEMP}/releases.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RELEASES_JSON"

          RELEASE_JSON="$(
            jq -c '[.[] | select(.draft == true and .name == "Stable Source Inbox")][0]' \
              "$RELEASES_JSON"
          )"

          if [ -z "$RELEASE_JSON" ] || [ "$RELEASE_JSON" = "null" ]; then
            echo "::error::Draft release 'Stable Source Inbox' was not found."
            echo "::error::Create one draft release with that exact title, upload the Stable Full ZIP to it, then run this workflow again."
            exit 1
          fi

          ASSET_JSON="$(
            printf '%s' "$RELEASE_JSON" \
              | jq -c '[.assets[] | select(.name | ascii_downcase | endswith(".zip"))] | sort_by(.created_at) | reverse | .[0]'
          )"

          if [ -z "$ASSET_JSON" ] || [ "$ASSET_JSON" = "null" ]; then
            echo "::error::No ZIP asset was found in draft release 'Stable Source Inbox'."
            exit 1
          fi

          ASSET_ID="$(printf '%s' "$ASSET_JSON" | jq -r '.id')"
          ASSET_NAME="$(printf '%s' "$ASSET_JSON" | jq -r '.name')"

          echo "asset_id=$ASSET_ID" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Using source asset: $ASSET_NAME"

      - name: Download private Stable draft ZIP
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_ID: ${{ steps.source.outputs.asset_id }}
          ASSET_NAME: ${{ steps.source.outputs.asset_name }}
        run: |
          set -euo pipefail

          ZIP_PATH="${RUNNER_TEMP}/stable-source.zip"

          curl --fail --location \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            --output "$ZIP_PATH"

          test -s "$ZIP_PATH"
          ZIP_SHA="$(sha256sum "$ZIP_PATH" | awk '{print $1}')"

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_sha=$ZIP_SHA" >> "$GITHUB_OUTPUT"
          echo "Input ZIP: $ASSET_NAME"
          echo "Input SHA-256: $ZIP_SHA"

      - name: Validate and extract Stable ZIP safely
        id: project
        shell: bash
        env:
          ZIP_PATH: ${{ steps.download.outputs.zip_path }}
        run: |
          set -euo pipefail

          EXTRACT_DIR="${RUNNER_TEMP}/stable-extracted"
          mkdir -p "$EXTRACT_DIR"

          python3 - "$ZIP_PATH" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import PurePosixPath

          zip_path = sys.argv[1]
          with zipfile.ZipFile(zip_path) as zf:
              bad = []
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      bad.append(name)
                      continue
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if mode and stat.S_ISLNK(mode):
                      bad.append(name)
              if bad:
                  raise SystemExit("Unsafe ZIP entries detected: " + ", ".join(bad[:20]))
          PY

          unzip -q "$ZIP_PATH" -d "$EXTRACT_DIR"

          if [ -f "$EXTRACT_DIR/gradlew" ]; then
            PROJECT_ROOT="$EXTRACT_DIR"
          else
            mapfile -t ROOT_DIRS < <(
              find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 -type d ! -name "__MACOSX" | sort
            )
            if [ "${#ROOT_DIRS[@]}" -eq 1 ] && [ -f "${ROOT_DIRS[0]}/gradlew" ]; then
              PROJECT_ROOT="${ROOT_DIRS[0]}"
            else
              echo "::error::Cannot find project root. ZIP must contain gradlew at root or inside one single top-level folder."
              exit 1
            fi
          fi

          if [ -f "$PROJECT_ROOT/android/app/build.gradle.kts" ]; then
            APP_GRADLE="$PROJECT_ROOT/android/app/build.gradle.kts"
          elif [ -f "$PROJECT_ROOT/android/app/build.gradle" ]; then
            APP_GRADLE="$PROJECT_ROOT/android/app/build.gradle"
          else
            echo "::error::android/app/build.gradle(.kts) is missing."
            exit 1
          fi

          export APP_GRADLE
          python3 <<'PY'
          import os, re
          from pathlib import Path

          text = Path(os.environ["APP_GRADLE"]).read_text(encoding="utf-8", errors="replace")

          app_id = re.search(r'applicationId\s*=\s*["\']([^"\']+)["\']', text)
          version_code = re.search(r'versionCode\s*=\s*(\d+)', text)
          version_name = re.search(r'versionName\s*=\s*["\']([^"\']+)["\']', text)

          if not app_id or app_id.group(1) != "com.todolist.app":
              raise SystemExit("SAFETY BLOCK: applicationId must be exactly com.todolist.app for Stable builds.")
          if not version_code or int(version_code.group(1)) < 46:
              raise SystemExit("SAFETY BLOCK: Stable versionCode must be >= 46.")
          if not version_name or "beta" in version_name.group(1).lower():
              raise SystemExit("SAFETY BLOCK: Stable versionName must not contain beta.")
          if "beta-debug.keystore" in text or "betaDebug" in text:
              raise SystemExit("SAFETY BLOCK: Beta signing configuration found in Stable source.")

          print("Stable package guard: PASS")
          print("versionCode:", version_code.group(1))
          print("versionName:", version_name.group(1))
          PY

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$PROJECT_ROOT/local.properties"
          chmod +x "$PROJECT_ROOT/gradlew"

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Restore exact Stable Android debug signing key
        shell: bash
        env:
          STABLE_KEYSTORE_B64: ${{ secrets.STABLE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${STABLE_KEYSTORE_B64:-}" ]; then
            echo "::error::Missing repository secret STABLE_DEBUG_KEYSTORE_BASE64."
            echo "::error::Do NOT generate a new key. Upload the exact debug.keystore that signed the currently installed Stable app."
            exit 1
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$STABLE_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          KEY_CERT_SHA="$(
            keytool -exportcert \
              -alias androiddebugkey \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
            | sha256sum | awk '{print $1}'
          )"

          echo "key_cert_sha=$KEY_CERT_SHA" >> "$GITHUB_ENV"
          echo "Stable signing key restored; certificate SHA-256: $KEY_CERT_SHA"

      - name: Build Stable debug APK with preserved signing certificate
        shell: bash
        working-directory: ${{ steps.project.outputs.project_root }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Collect and verify Stable APK signature
        id: package
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
          SOURCE_NAME: ${{ steps.source.outputs.asset_name }}
          SOURCE_SHA: ${{ steps.download.outputs.zip_sha }}
          KEY_CERT_SHA: ${{ env.key_cert_sha }}
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_ROOT/android/app/build/outputs/apk" -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "::error::APK not found after successful Gradle build."
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          APK_CERT_SHA="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA="$(printf '%s' "$KEY_CERT_SHA" | tr '[:upper:]' '[:lower:]')"

          if [ -z "$APK_CERT_SHA" ] || [ "$APK_CERT_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::APK certificate does not match restored Stable signing key."
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $APK_CERT_SHA"
            exit 1
          fi

          VERSION_NAME="$(grep -E 'versionName\s*=' "$PROJECT_ROOT/android/app/build.gradle.kts" | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          mkdir -p dist-ci
          OUT="dist-ci/To-Do-v${VERSION_NAME}-Stable-Build-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"

          META="dist-ci/To-Do-v${VERSION_NAME}-Stable-Build-${GITHUB_RUN_NUMBER}.txt"
          {
            echo "Source ZIP: $SOURCE_NAME"
            echo "Source ZIP SHA-256: $SOURCE_SHA"
            echo "APK: $(basename "$OUT")"
            echo "APK SHA-256: $(awk '{print $1}' "${OUT}.sha256")"
            echo "Signing certificate SHA-256: $APK_CERT_SHA"
            echo "GitHub Actions run: $GITHUB_RUN_ID"
          } > "$META"

          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha_path=${OUT}.sha256" >> "$GITHUB_OUTPUT"
          echo "meta_path=$META" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          cat "$META"

      - name: Upload Stable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: To-Do-v${{ steps.package.outputs.version_name }}-Stable-Build-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.sha_path }}
            ${{ steps.package.outputs.meta_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create Stable candidate GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.package.outputs.apk_path }}
          SHA_PATH: ${{ steps.package.outputs.sha_path }}
          META_PATH: ${{ steps.package.outputs.meta_path }}
          VERSION_NAME: ${{ steps.package.outputs.version_name }}
          SOURCE_NAME: ${{ steps.source.outputs.asset_name }}
          SOURCE_SHA: ${{ steps.download.outputs.zip_sha }}
        run: |
          set -euo pipefail

          TAG="stable-v${VERSION_NAME}-build-${GITHUB_RUN_NUMBER}"
          TITLE="To-Do v${VERSION_NAME} Stable Candidate · Build #${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            "$APK_PATH" \
            "$SHA_PATH" \
            "$META_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Stable mainline candidate built from private Draft source asset: ${SOURCE_NAME}. Source ZIP SHA-256: ${SOURCE_SHA}. APK was signed with the exact Stable debug signing key supplied through the repository secret and signature-verified before release. Keep this as a prerelease until phone upgrade/data migration is verified." \
            --prerelease

      - name: Remove consumed Stable source ZIP from private draft
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_ID: ${{ steps.source.outputs.asset_id }}
        run: |
          set -euo pipefail
          if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"; then
            echo "Consumed Stable source ZIP removed from Draft Release inbox."
          else
            echo "::warning::Stable build succeeded, but source ZIP could not be removed automatically."
          fi
