name: Build Android APK & Release

on:
  workflow_dispatch:
    inputs:
      build_label:
        description: "Build label, e.g. Cloud-Test or Tree-Beta-V1.0"
        required: true
        default: "Cloud-Test"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3

      # Keep the Android debug signing identity stable across nearby Beta builds.
      # This is for the separate Beta package only; never treat it as the Stable release key.
      - name: Restore Beta debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-todo-beta-debug-keystore-v1

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager not found at expected path; using runner preinstalled Android SDK."
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Collect APK and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "APK not found."
            find android/app/build/outputs -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p dist-ci

          SAFE_LABEL="$(printf '%s' '${{ inputs.build_label }}' \
            | tr ' /' '--' \
            | tr -cd 'A-Za-z0-9._-')"

          if [ -z "$SAFE_LABEL" ]; then
            SAFE_LABEL="Cloud-Build"
          fi

          OUT="dist-ci/To-Do-${SAFE_LABEL}-Build-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"

          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha_path=${OUT}.sha256" >> "$GITHUB_OUTPUT"
          echo "safe_label=$SAFE_LABEL" >> "$GITHUB_OUTPUT"

          echo "Built APK:"
          ls -lh "$OUT" "${OUT}.sha256"
          cat "${OUT}.sha256"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: To-Do-${{ steps.package.outputs.safe_label }}-Build-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.sha_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.package.outputs.apk_path }}
          SHA_PATH: ${{ steps.package.outputs.sha_path }}
          BUILD_LABEL: ${{ inputs.build_label }}
        run: |
          set -euo pipefail

          TAG="cloud-build-${GITHUB_RUN_NUMBER}"
          TITLE="To-Do ${BUILD_LABEL} · Build #${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            "$APK_PATH" \
            "$SHA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "GitHub Actions cloud build from commit ${GITHUB_SHA}. This is a prerelease/testing build. Do not use a Cloud-Test APK to overwrite the installed Stable app." \
            --prerelease
